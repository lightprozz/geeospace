<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="spaceos-parent-origin" content="__SPACEOS_PARENT_ORIGIN__">
  <meta name="color-scheme" content="light dark">
  <title>GeeO Calendar</title>
  <link rel="icon" href="/calendar-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/spaceos-app-v1.css">
  <link rel="stylesheet" href="/calendar.css">
  <script type="module" src="/calendar.mjs"></script>
</head>
<body>
  <main class="space-app">
    <header class="app-header space-app-identity">
      <div class="app-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <path d="M3 10h18M8 3v4m8-4v4m-8 8h2m4 0h2"></path>
        </svg>
      </div>
      <div>
        <h1>GeeO Calendar</h1>
        <p id="subtitle">Lịch làm việc</p>
      </div>
    </header>

    <section aria-labelledby="range-title">
      <div class="toolbar space-toolbar">
        <div class="date-controls" role="group" aria-label="Điều hướng ngày">
          <button id="today" class="today-button" type="button">Hôm nay</button>
          <button id="previous" class="arrow" type="button" aria-label="Khoảng trước">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 4-4 4 4 4"></path></svg>
          </button>
          <button id="next" class="arrow" type="button" aria-label="Khoảng sau">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 4 4 4-4 4"></path></svg>
          </button>
        </div>
        <div class="range-context">
          <h2 id="range-title" aria-live="polite"></h2>
          <span class="timezone" title="Asia/Ho_Chi_Minh">GMT+7</span>
        </div>
        <div class="toolbar-options">
          <div class="view-controls" role="group" aria-label="Chế độ xem">
            <button type="button" data-view="week" aria-pressed="true">Tuần</button>
            <button type="button" data-view="month" aria-pressed="false">Tháng</button>
            <button type="button" data-view="agenda" aria-pressed="false">Lịch biểu</button>
          </div>
          <label class="campus-filter" id="campus-filter" hidden>
            <span id="campus-label">Chi nhánh</span>
            <select id="campus"></select>
          </label>
        </div>
      </div>
      <div class="source-state" id="source-state" hidden>
        <div role="status">
          <strong id="state-title"></strong>
          <p id="state-detail"></p>
        </div>
        <button id="retry" type="button" hidden>Thử lại</button>
      </div>
      <div id="calendar" class="calendar"></div>
      <noscript><p>Bật JavaScript để xem GeeO Calendar.</p></noscript>
    </section>
  </main>
</body>
</html>
